dataset:
  root_dir: "dataset"
  tasks:
    - name: "Suturing"
      n_trials: 39
      n_gestures: 10
      gestures: ["G1", "G2", "G3", "G4", "G5", "G6", "G8", "G9", "G10", "G11"]
    - name: "Knot_Tying"
      n_trials: 36
      n_gestures: 6
      gestures: ["G1", "G11", "G12", "G13", "G14", "G15"]
    - name: "Needle_Passing"
      n_trials: 28
      n_gestures: 8
      gestures: ["G1", "G2", "G3", "G4", "G5", "G6", "G8", "G11"]
  total_trials: 103
  split_protocol: "UserOut" # 8-fold Leave-One-User-Out
  splits_dir: "dataset/Experimental_setup"
  seed: 42

kinematics:
  sampling_rate_hz: 30
  dimension: 76
  normalize: true

video:
  fps: 30
  resolution: [640, 480]
  camera: "capture1" # primary left camera

windowing:
  window_size: 16
  stride: 8
