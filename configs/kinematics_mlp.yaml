model:
  name: "KinematicsMLP"
  input_dim: 76
  hidden_dims: [128, 64]
  dropout: 0.2
  activation: "gelu"
  use_layer_norm: true

training:
  epochs: 15
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  use_class_weights: true
  patience: 4
  seed: 42

data:
  dataset_dir: "dataset"
  window_size: 16
  train_stride: 8
  eval_stride: 8
