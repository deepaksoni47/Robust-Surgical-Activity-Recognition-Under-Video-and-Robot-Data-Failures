model:
  name: "KinematicsGRU"
  input_dim: 76
  proj_dim: 128
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2
  bidirectional: false

training:
  epochs: 15
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  use_class_weights: true
  patience: 4
  seed: 42

data:
  dataset_dir: "dataset"
  window_size: 16
  train_stride: 8
  eval_stride: 8
